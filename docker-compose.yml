# ============================================================
# Docker Compose - CRM Automotora ERP
# Orchestrates backend (FastAPI) + frontend (React/Nginx)
# ============================================================
# Usage:
#   cp .env.docker.example .env.docker
#   docker compose up -d --build
# ============================================================

services:
  # ── Backend API (FastAPI + Uvicorn) ─────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: automotora-backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      - DATABASE_URL=sqlite:///./data/automotora_crm.db
    volumes:
      - backend-data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - automotora-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── Frontend (React + Nginx) ────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: automotora-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - automotora-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# ── Volumes ─────────────────────────────────────────────────
volumes:
  backend-data:
    driver: local

# ── Networks ────────────────────────────────────────────────
networks:
  automotora-network:
    driver: bridge
